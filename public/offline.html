<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Jogo da Cobrinha</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #eef2ff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
        background:
          radial-gradient(900px 500px at 20% 0%, rgba(34, 211, 238, 0.18), transparent 60%),
          radial-gradient(800px 500px at 80% 100%, rgba(244, 114, 182, 0.16), transparent 60%),
          linear-gradient(160deg, #0a0f27 0%, #14103a 55%, #1d1247 100%);
      }
      .box {
        max-width: 380px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      p {
        margin: 0 0 20px;
        color: #9aa6d2;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 12px;
        font-weight: 700;
        color: #06121f;
        text-decoration: none;
        background: linear-gradient(135deg, #22d3ee, #a3e635);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>🐍 Sem conexão</h1>
      <p>
        O jogo precisa de uma primeira visita com internet para guardar os arquivos. Verifique sua
        rede e tente de novo.
      </p>
      <a href="/">Tentar novamente</a>
    </div>
  </body>
</html>
